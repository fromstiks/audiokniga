name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Опубликовать APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: audiohunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Отправить APK в Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '642163018' }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Секрет TELEGRAM_BOT_TOKEN не задан — отправку пропускаю."
            echo "APK по-прежнему доступен в разделе Artifacts этого запуска."
            exit 0
          fi
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK не найден, отправлять нечего."
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "Отправляю $APK ($SIZE) в Telegram, chat_id=${TG_CHAT}"
          HTTP_CODE=$(curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT}" \
            -F document=@"${APK}" \
            -F caption="АудиоХантер · сборка ${GITHUB_SHA:0:7} · ветка ${GITHUB_REF_NAME} · ${SIZE}" \
            -o response.json -w "%{http_code}")
          echo "HTTP статус: $HTTP_CODE"
          echo "Ответ Telegram:"
          cat response.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram API вернул ошибку — см. ответ выше."
            exit 1
          fi
          echo "Отправлено."
